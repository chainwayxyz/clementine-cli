[package]
name = "clementine-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "clementine_cli"
path = "src/lib.rs"

[[bin]]
name = "clementine"
path = "src/bin/cli.rs"

[dependencies]
bitcoin = { version = "0.32.5", features = ["rand-std"] }
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
clap = { version = "4.5.4", features = ["derive"] }
rand = { version = "0.9.1", features = ["std_rng"] }
getrandom = "0.3.3"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hex = "0.4"
colored = "3.0"
open = "5.0"
secp256k1 = { version = "0.31.0", features = [
  "serde",
  "rand",
  "std",
  "global-context",
] }
tokio = { version = "1.36", features = ["full"] }
sha2 = "0.10.9"
bitcoincore-rpc = { version = "0.18.0" }
alloy = { version = "1.0.23", features = ["full"] }
alloy-sol-types = { version = "1.0.23", default-features = false, features = [
  "json",
] }
alloy-contract = "1.0.23"
alloy-transport = "1.0.23"
serde = "1.0.219"
toml = "0.9.5"
url = { version = "2.5", features = ["serde"] }
secrecy = { version = "0.10.0", features = ["serde"] }

[patch.crates-io]
secp256k1 = { git = "https://github.com/rust-bitcoin/rust-secp256k1", rev = "4d36fefdddb118425bb9bcf611bb6e4dff306cfc" }
bitcoincore-rpc = { version = "0.18.0", git = "https://github.com/chainwayxyz/rust-bitcoincore-rpc.git", rev = "5da45109a2de352472a6056ef90a517b66bc106f" }
