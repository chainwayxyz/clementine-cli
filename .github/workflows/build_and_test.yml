name: Build And Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - cli-rust-rewrite
      - "releases/*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ (github.ref != 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  debug_tests_all_features:
    name: Debug | All features | Test
    runs-on: ubicloud-standard-16
    steps:
      - uses: actions/checkout@v4
      - name: Test on the minimum supported Rust version
        run: |
          minimum_rust=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "clementine-cli") | .rust_version')
          rustup toolchain install "$minimum_rust" --profile minimal
          cargo +"$minimum_rust" test --locked --workspace --all-targets --all-features

  release_tests_all_features:
    name: Release | All features | Test
    runs-on: ubicloud-standard-16
    steps:
      - uses: actions/checkout@v4
      - name: Test on the release toolchain
        run: cargo test --release --locked --workspace --all-targets --all-features
