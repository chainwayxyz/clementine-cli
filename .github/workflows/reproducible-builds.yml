name: Reproducible Builds

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux-and-win64-on-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ${{ matrix.platform }}
        run: nix build .#${{ matrix.platform }}

      - name: Rebuild ${{ matrix.platform }} to verify reproducibility
        run: |
          echo "Rebuilding ${{ matrix.platform }} to confirm reproducibility..."
          nix build .#${{ matrix.platform }} --rebuild
          echo "Rebuild for ${{ matrix.platform }} completed"

      - name: Hash result
        id: hash
        run: |
          PLATFORM="${{ matrix.platform }}"
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "$PLATFORM hash: $H"

      - name: SHA256 of binary
        run: |
          PLATFORM="${{ matrix.platform }}"
          if [ "$PLATFORM" = "windows-x86_64" ]; then
            BINARY="./result/bin/clementine-cli.exe"
          else
            BINARY="./result/bin/clementine-cli"
          fi
          if [ -f "$BINARY" ]; then
            SHA256=$(shasum -a 256 "$BINARY" | awk '{print $1}')
            echo "${{ matrix.platform }} binary sha256: $SHA256"
            echo "Binary path: $BINARY"
          else
            echo "No binary found at $BINARY"
            exit 1
          fi