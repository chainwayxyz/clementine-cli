name: Reproducible Builds

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux-and-win64-on-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ${{ matrix.platform }}
        run: nix build .#${{ matrix.platform }}

      - name: Hash result
        id: hash
        run: |
          PLATFORM="${{ matrix.platform }}"
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "$PLATFORM hash: $H"

      - name: SHA256 of binary
        run: |
          PLATFORM="${{ matrix.platform }}"
          if [ "$PLATFORM" = "windows-x86_64" ]; then
            BINARY="./result/bin/clementine-cli.exe"
          else
            BINARY="./result/bin/clementine-cli"
          fi

          if [ -f "$BINARY" ]; then
            SHA256=$(shasum -a 256 "$BINARY" | awk '{print $1}')
            echo "${{ matrix.platform }} binary sha256: $SHA256"
            echo "Binary path: $BINARY"
          else
            echo "No binary found at $BINARY"
            exit 1
          fi

  aarch64-linux-gnu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build aarch64-linux-gnu
        run: nix build .#aarch64-linux-gnu

      - name: Hash result
        id: hash
        run: |
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "aarch64-linux-gnu hash: $H"

      - name: SHA256 of binary
        run: |
          BINARY="./result/bin/clementine-cli"
          if [ -f "$BINARY" ]; then
            SHA256=$(shasum -a 256 "$BINARY" | awk '{print $1}')
            echo "aarch64-linux-gnu binary sha256: $SHA256"
            echo "Binary path: $BINARY"
          else
            echo "No binary found at $BINARY"
            exit 1
          fi

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build darwin-aarch64
        run: nix build .#darwin-aarch64

      - name: Hash result
        id: hash
        run: |
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "darwin-aarch64 hash: $H"

      - name: SHA256 of binary
        run: |
          BINARY="./result/bin/clementine-cli"
          if [ -f "$BINARY" ]; then
            SHA256=$(shasum -a 256 "$BINARY" | awk '{print $1}')
            echo "darwin-aarch64 binary sha256: $SHA256"
            echo "Binary path: $BINARY"
          else
            echo "No binary found at $BINARY"
            exit 1
          fi

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build darwin-x86_64
        run: nix build .#darwin-x86_64

      - name: Rebuild darwin-x86_64 for reproducibility
        run: |
          nix build --rebuild .#darwin-x86_64

      - name: Hash result
        id: hash
        run: |
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "darwin-x86_64 hash: $H"

      - name: SHA256 of binary
        run: |
          BINARY="./result/bin/clementine-cli"
          if [ -f "$BINARY" ]; then
            SHA256=$(shasum -a 256 "$BINARY" | awk '{print $1}')
            echo "darwin-x86_64 binary sha256: $SHA256"
            echo "Binary path: $BINARY"
          else
            echo "No binary found at $BINARY"
            exit 1
          fi