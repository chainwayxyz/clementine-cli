name: Reproducible Builds

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux-and-win64-on-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - windows-x86_64 
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ${{ matrix.platform }}
        run: nix build .#${{ matrix.platform }}

      - name: Hash result
        id: hash
        run: |
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.platform }} hash: $H"

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (2.32.1)
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.32.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build darwin-aarch64
        run: nix build .#darwin-aarch64

      - name: Hash result
        id: hash
        run: |
          H=$(nix hash path ./result)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "darwin-aarch64 hash: $H"

      - name: SHA256 of binary
        run: |
          BINARY=$(find ./result/bin -type f -perm +111 | head -n 1)
          if [ -n "$BINARY" ]; then
            SHA256=$(shasum -a 256 "$BINARY" | awk '{print $1}')
            echo "darwin-aarch64 binary sha256: $SHA256"
            echo "Binary path: $BINARY"
          else
            echo "No binary found in ./result/bin"
          fi

      - name: Dump full /nix/store listing
        run: |
          ls /nix/store > nix_store.txt

      - name: Upload nix_store.txt
        uses: actions/upload-artifact@v4
        with:
          name: nix-store-macos-arm64
          path: nix_store.txt
