name: Reproducible Builds Verification

# Platform coverage:
# - Linux: x86_64, ARM64 (aarch64), Windows cross-compile (via Nix)
# - Windows: Native build (x86_64-pc-windows-msvc via cargo)
# - macOS: Intel (x86_64), Apple Silicon (arm64) (via Nix)

on:
  push:
    branches:
      - main
      - "releases/*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ (github.ref != 'refs/heads/main') }}

jobs:
  verify-reproducibility-linux:
    name: Verify Reproducible Builds (Linux/Windows)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - win64

    steps:
      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix (optional binary cache)
        uses: cachix/cachix-action@v13
        with:
          name: clementine-cli
          skipPush: true
        continue-on-error: true

      - name: Build ${{ matrix.platform }} (first time)
        run: |
          echo "Building for ${{ matrix.platform }}..."
          nix build .#${{ matrix.platform }}
          echo "First build complete"

      - name: Calculate first build hash
        id: hash1
        run: |
          HASH=$(nix hash path ./result)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "First build hash: $HASH"

      - name: Remove build result
        run: rm -rf result

      - name: Build ${{ matrix.platform }} (second time)
        run: |
          echo "Rebuilding for ${{ matrix.platform }}..."
          nix build .#${{ matrix.platform }}
          echo "Second build complete"

      - name: Calculate second build hash
        id: hash2
        run: |
          HASH=$(nix hash path ./result)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Second build hash: $HASH"

      - name: Verify reproducibility
        run: |
          HASH1="${{ steps.hash1.outputs.hash }}"
          HASH2="${{ steps.hash2.outputs.hash }}"

          echo "Comparing hashes for ${{ matrix.platform }}:"
          echo "  First build:  $HASH1"
          echo "  Second build: $HASH2"

          if [ "$HASH1" = "$HASH2" ]; then
            echo "✓ Build is reproducible! Hashes match."
            exit 0
          else
            echo "✗ Build is NOT reproducible! Hashes differ."
            exit 1
          fi

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clementine-cli-${{ matrix.platform }}
          path: result/bin/*
          retention-days: 7

  verify-reproducibility-windows:
    name: Verify Reproducible Windows Build
    runs-on: windows-latest

    steps:
      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.89.0"
          components: rustfmt, rust-src

      - name: Build (first time)
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1"
          RUSTFLAGS: "-C debuginfo=0 -C opt-level=3 -C codegen-units=1 -C strip=none -C link-arg=/PDBALTPATH:clementine-cli.pdb -C link-arg=/Brepro"
        run: |
          echo "Building for Windows native (x86_64-pc-windows-msvc) with reproducible settings..."
          cargo build --release
          echo "First build complete"

      - name: Calculate first build hash
        id: hash1
        shell: bash
        run: |
          HASH=$(sha256sum target/release/clementine-cli.exe | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "First build hash: $HASH"

      - name: Clean build artifacts
        run: cargo clean

      - name: Build (second time)
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1"
          RUSTFLAGS: "-C debuginfo=0 -C opt-level=3 -C codegen-units=1 -C strip=none -C link-arg=/PDBALTPATH:clementine-cli.pdb -C link-arg=/Brepro"
        run: |
          echo "Rebuilding for Windows native with reproducible settings..."
          cargo build --release
          echo "Second build complete"

      - name: Calculate second build hash
        id: hash2
        shell: bash
        run: |
          HASH=$(sha256sum target/release/clementine-cli.exe | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Second build hash: $HASH"

      - name: Verify reproducibility
        shell: bash
        run: |
          HASH1="${{ steps.hash1.outputs.hash }}"
          HASH2="${{ steps.hash2.outputs.hash }}"

          echo "Comparing hashes for Windows native build:"
          echo "  First build:  $HASH1"
          echo "  Second build: $HASH2"

          if [ "$HASH1" = "$HASH2" ]; then
            echo "✓ Native Windows build is reproducible! Hashes match."
            exit 0
          else
            echo "✗ Native Windows build is NOT reproducible! Hashes differ."
            echo "This should not happen with our reproducibility settings."
            exit 1
          fi

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clementine-cli-windows-native
          path: target/release/clementine-cli.exe
          retention-days: 7

  verify-reproducibility-macos:
    name: Verify Reproducible Builds (macOS)
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - x86_64-apple-darwin
          - arm64-apple-darwin

    steps:
      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix (optional binary cache)
        uses: cachix/cachix-action@v13
        with:
          name: clementine-cli
          skipPush: true
        continue-on-error: true

      - name: Build ${{ matrix.platform }} (first time)
        run: |
          echo "Building for ${{ matrix.platform }}..."
          nix build .#${{ matrix.platform }}
          echo "First build complete"

      - name: Calculate first build hash
        id: hash1
        run: |
          HASH=$(nix hash path ./result)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "First build hash: $HASH"

      - name: Remove build result
        run: rm -rf result

      - name: Build ${{ matrix.platform }} (second time)
        run: |
          echo "Rebuilding for ${{ matrix.platform }}..."
          nix build .#${{ matrix.platform }}
          echo "Second build complete"

      - name: Calculate second build hash
        id: hash2
        run: |
          HASH=$(nix hash path ./result)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Second build hash: $HASH"

      - name: Verify reproducibility
        run: |
          HASH1="${{ steps.hash1.outputs.hash }}"
          HASH2="${{ steps.hash2.outputs.hash }}"

          echo "Comparing hashes for ${{ matrix.platform }}:"
          echo "  First build:  $HASH1"
          echo "  Second build: $HASH2"

          if [ "$HASH1" = "$HASH2" ]; then
            echo "✓ Build is reproducible! Hashes match."
            exit 0
          else
            echo "✗ Build is NOT reproducible! Hashes differ."
            exit 1
          fi

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clementine-cli-${{ matrix.platform }}
          path: result/bin/*
          retention-days: 7

  verify-hash-documentation:
    name: Verify Documented Hashes
    runs-on: ubuntu-latest
    needs: [verify-reproducibility-linux, verify-reproducibility-windows, verify-reproducibility-macos]

    steps:
      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and check documented hash
        run: |
          echo "Building x86_64-linux-gnu to verify documented hash..."
          nix build .#x86_64-linux-gnu
          ACTUAL_HASH=$(nix hash path ./result)

          # Extract documented hash from reproducible-builds.md
          DOCUMENTED_HASH=$(grep -A 10 "Expected Hashes" docs/reproducible-builds.md | grep "x86_64-linux-gnu" | awk '{print $3}' | tr -d '`|')

          echo "Documented hash: $DOCUMENTED_HASH"
          echo "Actual hash:     $ACTUAL_HASH"

          if [ -n "$DOCUMENTED_HASH" ] && [ "$DOCUMENTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "⚠️  Warning: Documented hash differs from actual build hash."
            echo "This is expected if source code or dependencies changed."
            echo "Please update docs/reproducible-builds.md with the new hash:"
            echo "  $ACTUAL_HASH"
          else
            echo "✓ Documented hash matches actual build (or not found in docs)"
          fi

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [verify-reproducibility-linux, verify-reproducibility-windows, verify-reproducibility-macos, verify-hash-documentation]
    if: always()

    steps:
      - name: Check results
        run: |
          LINUX_RESULT="${{ needs.verify-reproducibility-linux.result }}"
          WINDOWS_RESULT="${{ needs.verify-reproducibility-windows.result }}"
          MACOS_RESULT="${{ needs.verify-reproducibility-macos.result }}"

          echo "Build Results Summary:"
          echo "  Linux (Nix):           $LINUX_RESULT"
          echo "  Windows (Nix cross):   $LINUX_RESULT (included in Linux job)"
          echo "  Windows (native):      $WINDOWS_RESULT"
          echo "  macOS (Nix):           $MACOS_RESULT"
          echo ""

          # All jobs must succeed
          if [ "$LINUX_RESULT" = "success" ] && [ "$WINDOWS_RESULT" = "success" ] && [ "$MACOS_RESULT" = "success" ]; then
            echo "✓ All build verifications passed!"
            echo ""
            echo "Reproducible builds verified:"
            echo "  - Linux (x86_64, ARM64, ARMv7) via Nix"
            echo "  - Windows (x86_64 cross-compiled) via Nix"
            echo "  - macOS (Intel, Apple Silicon) via Nix"
            echo ""
            echo "Native build verified:"
            echo "  - Windows (x86_64-pc-windows-msvc) via cargo"
            exit 0
          else
            echo "✗ Build verification failed on one or more platforms"
            echo "Check the individual job logs for details"
            exit 1
          fi
